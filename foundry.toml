[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
auto_detect_solc = true
optimizer = true
optimizer_runs = 800
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
evm_version = "cancun"
# ffi (arbitrary shell exec from Solidity) and broad fs read-write were both
# enabled but unused by any script in this repo (verified: no vm.ffi/
# vm.readFile/vm.writeFile calls exist) — disabled since neither is needed
# and both are a real risk if a future script pulls in untrusted code.
ffi = false
gas_reports = ["*"]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "@rapiddex/v3-core/=lib/v3-core-main/",
  "@rapiddex/v3-periphery/=lib/v3-periphery-main/",
  "v3-core/=lib/v3-core-main/contracts/",
  "v3-periphery/=lib/v3-periphery-main/contracts/"
]
